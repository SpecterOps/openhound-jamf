name: jamf
version: 0.1.0
description: "Jamf resource collector for OpenGraph"
authors:
  - name: Lance Cain
    email: lcain@specterops.io
  - name: Joey Dreijer
    email: jdreijer@specterops.io

type: local
license: APACHE-2.0
homepage: https://github.com/specterops/openhound-jamf
references:
  - name: OpenHound
    url: https://github.com/specterops/openhound

credentials:
  - name: username
    description: The username to authenticate to the Jamf API
    required: true
  - name: password
    description: The password to authenticate to the Jamf API
    required: true

parameters:
  - name: size
    description: The amount of assets to generate
    required: false
    default: 10000
  - name: saml_metadata_allowed_origins
    description: >-
      Comma-separated HTTPS origins that may serve the SAML identity provider
      metadata, for example https://example.okta.com. Without it, only the Jamf
      origin is fetched. For an identity provider on another origin, the issuer
      is then unknown: the collector writes the Jamf SAML service provider, its
      assertion consumer services, its rule, and its account edges, but no issuer
      node and no SAML_TrustsIssuer edge, so the correlator cannot pair it.
    required: false

tags: [ "jamf", "source", "opengraph" ]
