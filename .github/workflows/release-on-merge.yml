name: Create Release Tag and publish new version

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "extension.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose/**"
      - ".github/workflows/release-on-merge.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-container.yml"

permissions:
  contents: read

# Serialize complete releases, including latest aliases, and retain pending runs.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  tag-release:
    if: >-
      github.repository == 'SpecterOps/openhound-jamf' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.versioning.outputs.new_version }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine release version
        id: versioning
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch --tags
          # Reuse this merge's release on retries rather than minting a new version.
          EXISTING_TAG=$(git tag --points-at HEAD --sort=v:refname |
            { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | tail -n 1)
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "new_version=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG=$(git tag --sort=v:refname |
            { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | tail -n 1)
          VERSION=${LATEST_TAG:-v0.0.0}
          VERSION=${VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BRANCH_NAME" in
            fix/*|patch/*|chore/*) PATCH=$((PATCH + 1)) ;;
            feature/*|minor/*) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major/*) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "Branch does not trigger release."; exit 0 ;;
          esac
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag-release
    if: needs.tag-release.outputs.new_version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag-release.outputs.new_version }}
    secrets: inherit

  publish-container:
    needs: [tag-release, publish]
    if: needs.tag-release.outputs.new_version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      tag: ${{ needs.tag-release.outputs.new_version }}
